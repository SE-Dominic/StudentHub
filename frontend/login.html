<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: #f4f6f8;
			color: #1f2937;
		}
		.login-card {
			width: min(90%, 400px);
			padding: 2rem;
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, .1);
		}
		h1 { margin: 0 0 1.5rem; text-align: center; }
		label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
		input {
			width: 100%;
			padding: .75rem;
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			font-size: 1rem;
		}
		button { width: 100%; padding: .75rem; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
		.login-button { margin-top: 1.5rem; background: #2563eb; color: #fff; }
		.forgot-button { margin-top: .75rem; background: transparent; color: #2563eb; }
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Log In</h1>
		<form id="loginForm" action="http://127.0.0.1:8000/login" method="post">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" placeholder="you@example.com" required>

			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="Enter your password" required>

			<button class="login-button" type="submit">Login</button>
			<button class="forgot-button" type="button">Forgot password?</button>
		</form>
	</main>
	<script src="login.js"></script>
</body>
</html>
