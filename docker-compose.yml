services:
  postgres:
    image: postgres:16
    container_name: studenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studenthub
      POSTGRES_USER: studenthub
      POSTGRES_PASSWORD: studenthub
    ports:
      - "5432:5432"
    volumes:
      - studenthub-postgres-data:/var/lib/postgresql/data

volumes:
  studenthub-postgres-data:
